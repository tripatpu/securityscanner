# vulnhunter.conf — sample configuration
# Load with:  ./vulnhunter.sh --config vulnhunter.conf -l urls.txt -m active
# CLI flags override values set here. Lines starting with # are ignored.
# Format: key=value  (quotes optional)

# Concurrency / timing
threads=40
timeout=12
delay=0            # per-request delay inside each worker (float seconds)
sleep=6            # base seconds for time-based blind (SQLi/CMDi) checks
retries=2          # retries with exponential backoff on curl failure

# Which classes to test (comma list): lfi,rfi,xss,sqli,cmdi
classes=lfi,rfi,xss,sqli,cmdi

# Transport / auth
ua=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 vulnhunter
proxy=                     # e.g. http://127.0.0.1:8080 to route through Burp
cookie=                    # e.g. session=abc; csrftoken=xyz

# Out-of-band confirmation domain for RFI/SSRF (Burp Collaborator / interactsh)
collab=                    # e.g. xxxxxxxx.oastify.com
